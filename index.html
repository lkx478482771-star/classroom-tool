<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4f5bff">
<meta name="description" content="课堂整理工具：课程笔记、语音录音转写、AI 总结与待办管理。">
<title>课堂整理工具</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="课程侧栏">
    <div class="sidebar-head">
      <a class="brand" href="index.html" aria-label="课堂整理工具首页">
        <span class="brand-mark"><svg class="icon"><use href="assets/icons.svg#icon-grad"></use></svg></span>
        <span class="brand-name">课堂整理</span>
      </a>
      <div class="sidebar-actions">
        <button type="button" class="btn-icon" id="themeBtn" aria-label="切换深色模式">
          <svg class="icon" id="themeIcon"><use href="assets/icons.svg#icon-moon"></use></svg>
        </button>
        <button type="button" class="btn-icon" id="aiSettingsBtn" aria-label="AI 设置">
          <svg class="icon"><use href="assets/icons.svg#icon-sparkles"></use></svg>
        </button>
        <button type="button" class="btn-icon" id="addCourseBtn" aria-label="新建课程">
          <svg class="icon"><use href="assets/icons.svg#icon-plus"></use></svg>
        </button>
        <a class="btn-icon" href="student-toolkit.html" aria-label="学生工具箱">
          <svg class="icon"><use href="assets/icons.svg#icon-toolkit"></use></svg>
        </a>
      </div>
    </div>
    <div class="search-field">
      <svg class="icon icon-sm"><use href="assets/icons.svg#icon-search"></use></svg>
      <input id="searchInput" type="search" placeholder="搜索笔记..." autocomplete="off" aria-label="搜索笔记">
      <button type="button" class="clear-btn" id="searchClear" aria-label="清除搜索" hidden>
        <svg class="icon icon-sm"><use href="assets/icons.svg#icon-x"></use></svg>
      </button>
    </div>
    <nav class="course-list" id="courseList" aria-label="课程列表"></nav>
    <div class="sidebar-foot">
      <div class="stat-row" id="sidebarFooter"></div>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

  <main class="main-panel">
    <div class="mobile-topbar">
      <button type="button" class="btn-icon" id="menuBtn" aria-label="打开课程列表">
        <svg class="icon"><use href="assets/icons.svg#icon-menu"></use></svg>
      </button>
      <span class="brand-name">课堂整理</span>
    </div>
    <div class="main-inner" id="mainInner"></div>
  </main>
</div>

<div class="modal-overlay" id="courseModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="courseModalTitle">
    <div class="modal-head">
      <h3 id="courseModalTitle">新建课程</h3>
      <button type="button" class="modal-close" data-close aria-label="关闭">
        <svg class="icon"><use href="assets/icons.svg#icon-x"></use></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="label" for="courseName">课程名称</label>
        <input class="input" id="courseName" placeholder="高等数学" autocomplete="off">
      </div>
      <div class="field">
        <label class="label" for="courseTeacher">授课教师</label>
        <input class="input" id="courseTeacher" placeholder="王老师（选填）" autocomplete="off">
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-secondary" data-close>取消</button>
      <button type="button" class="btn btn-primary" id="saveCourseBtn">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="noteModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="noteModalTitle">
    <div class="modal-head">
      <h3 id="noteModalTitle">新建笔记</h3>
      <button type="button" class="modal-close" data-close aria-label="关闭">
        <svg class="icon"><use href="assets/icons.svg#icon-x"></use></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="label" for="noteTitle">标题</label>
        <input class="input" id="noteTitle" placeholder="第一章 极限与连续" autocomplete="off">
      </div>
      <div class="field">
        <label class="label" for="noteDate">日期</label>
        <input class="input" id="noteDate" type="date">
      </div>
      <div class="field">
        <label class="label" for="noteContent">笔记内容</label>
        <textarea class="textarea" id="noteContent" rows="6" placeholder="课堂内容、理解与疑问..."></textarea>
      </div>
      <div class="field">
        <label class="label" for="noteKeyPoints">重点标记</label>
        <textarea class="textarea" id="noteKeyPoints" rows="2" placeholder="每行一个重点"></textarea>
        <span class="hint">每行一个重点，可在 AI 总结后自动填充</span>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-secondary" data-close>取消</button>
      <button type="button" class="btn btn-primary" id="saveNoteBtn">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="todoModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="todoModalTitle">
    <div class="modal-head">
      <h3 id="todoModalTitle">新建待办</h3>
      <button type="button" class="modal-close" data-close aria-label="关闭">
        <svg class="icon"><use href="assets/icons.svg#icon-x"></use></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="label" for="todoTitle">任务内容</label>
        <input class="input" id="todoTitle" placeholder="完成第三章习题" autocomplete="off">
      </div>
      <div class="field">
        <label class="label" for="todoDueDate">截止日期</label>
        <input class="input" id="todoDueDate" type="date">
      </div>
      <div class="field">
        <label class="label" for="todoPriority">优先级</label>
        <select class="select" id="todoPriority">
          <option value="medium">中</option>
          <option value="high">高</option>
          <option value="low">低</option>
        </select>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-secondary" data-close>取消</button>
      <button type="button" class="btn btn-primary" id="saveTodoBtn">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="aiSettingsModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="aiSettingsTitle">
    <div class="modal-head">
      <h3 id="aiSettingsTitle">AI 总结设置</h3>
      <button type="button" class="modal-close" data-close aria-label="关闭">
        <svg class="icon"><use href="assets/icons.svg#icon-x"></use></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="label" for="aiEndpoint">API 地址</label>
        <input class="input" id="aiEndpoint" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label class="label" for="aiApiKey">API Key</label>
        <input class="input" id="aiApiKey" type="password" autocomplete="off">
        <span class="hint">密钥仅保存在本机浏览器，不会上传到仓库</span>
      </div>
      <div class="field">
        <label class="label" for="aiModel">模型</label>
        <input class="input" id="aiModel" autocomplete="off" spellcheck="false">
      </div>
      <div class="ai-status" id="aiStatus"></div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-secondary" data-close>取消</button>
      <button type="button" class="btn btn-primary" id="saveAiBtn">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="aiSummaryModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="aiSummaryTitle">
    <div class="modal-head">
      <h3 id="aiSummaryTitle">AI 总结结果</h3>
      <button type="button" class="modal-close" data-close aria-label="关闭">
        <svg class="icon"><use href="assets/icons.svg#icon-x"></use></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="summary-content" id="summaryContent"></div>
      <div>
        <div class="keypoints-label">重点提炼</div>
        <div id="summaryKeyPoints"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-secondary" data-close>关闭</button>
      <button type="button" class="btn btn-primary" id="applyAiBtn">应用到笔记</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  const STORAGE_KEY = 'classroom_organizer';
  const THEME_KEY = 'dark_mode';
  const AI_KEY = 'ai_settings';
  const colors = ['#4f5bff', '#7a5cff', '#e5484d', '#b45d0c', '#0e9f6e', '#2f6fed', '#d63384'];

  const state = { courses: [], activeCourseId: null };
  let sq = '';
  let ct = 'notes';
  let expandedNoteId = null;
  let rec = null;
  let isRec = false;
  let isPause = false;
  let fin = '';
  let inter = '';
  let recStart = 0;
  let recTimer = null;
  let aiS = {};
  let aiR = null;
  let editCourseId = null;
  let editNoteId = null;

  function $(id) { return document.getElementById(id); }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtDate(d) {
    if (!d) return '';
    const p = String(d).split('-');
    return p[1] + '/' + p[2];
  }
  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function getCourse() {
    return state.courses.find(function (c) { return c.id === state.activeCourseId; }) || null;
  }

  // ---------- 存储 ----------
  function normalizeNote(n) {
    return {
      id: String((n && n.id) || uid()),
      title: String((n && n.title) || ''),
      date: String((n && n.date) || ''),
      content: String((n && n.content) || ''),
      keyPoints: Array.isArray(n && n.keyPoints) ? n.keyPoints.map(String) : [],
      pinned: !!(n && n.pinned)
    };
  }
  function normalizeTodo(t) {
    const p = ['high', 'medium', 'low'];
    return {
      id: String((t && t.id) || uid()),
      title: String((t && t.title) || ''),
      dueDate: String((t && t.dueDate) || ''),
      priority: p.indexOf(t && t.priority) > -1 ? t.priority : 'medium',
      completed: !!(t && t.completed)
    };
  }
  function normalizeCourse(c) {
    return {
      id: String((c && c.id) || uid()),
      name: String((c && c.name) || '').slice(0, 120),
      teacher: String((c && c.teacher) || '').slice(0, 60),
      color: (c && colors.indexOf(c.color) > -1) ? c.color : colors[state.courses.length % colors.length],
      notes: Array.isArray(c && c.notes) ? c.notes.map(normalizeNote) : [],
      todos: Array.isArray(c && c.todos) ? c.todos.map(normalizeTodo) : []
    };
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const data = raw ? JSON.parse(raw) : null;
      if (data && Array.isArray(data.courses)) {
        state.courses = data.courses.map(normalizeCourse);
        state.activeCourseId = data.activeCourseId && state.courses.some(function (c) { return c.id === data.activeCourseId; })
          ? data.activeCourseId
          : (state.courses[0] ? state.courses[0].id : null);
      } else {
        state.courses = [];
        state.activeCourseId = null;
      }
    } catch (e) {
      state.courses = [];
      state.activeCourseId = null;
    }
  }
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderStats();
    } catch (e) {
      toast('保存失败：本地存储不可用', 'error');
    }
  }

  // ---------- Toast / 主题 ----------
  const toastEl = $('toast');
  let toastTimer = null;
  function toast(message, type) {
    toastEl.textContent = message;
    toastEl.className = 'toast ' + (type || '') + ' show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = 'toast'; }, 2200);
  }

  function setTheme(dark) {
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    try { localStorage.setItem(THEME_KEY, dark ? 'true' : 'false'); } catch (e) {}
    const icon = $('themeIcon');
    if (icon) icon.setAttribute('href', 'assets/icons.svg#' + (dark ? 'icon-sun' : 'icon-moon'));
  }
  function toggleDarkMode() {
    setTheme(document.documentElement.dataset.theme !== 'dark');
  }
  function applySavedTheme() {
    let dark = false;
    try { dark = localStorage.getItem(THEME_KEY) === 'true'; } catch (e) {}
    setTheme(dark);
  }

  // ---------- 模态框 ----------
  function openModal(id) { $(id).classList.add('show'); }
  function closeModal(id) { $(id).classList.remove('show'); }
  function closeAllModals() {
    ['courseModal', 'noteModal', 'todoModal', 'aiSettingsModal', 'aiSummaryModal'].forEach(closeModal);
  }
  document.querySelectorAll('[data-close]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const overlay = btn.closest('.modal-overlay');
      if (overlay) overlay.classList.remove('show');
    });
  });

  // ---------- 搜索 ----------
  const searchInput = $('searchInput');
  searchInput.addEventListener('input', function () {
    sq = searchInput.value.trim().toLowerCase();
    $('searchClear').hidden = !sq;
    renderMain();
  });
  $('searchClear').addEventListener('click', function () {
    searchInput.value = '';
    sq = '';
    $('searchClear').hidden = true;
    renderMain();
    searchInput.focus();
  });

  // ---------- 课程 ----------
  function addCourse(name, teacher) {
    state.courses.push({
      id: uid(), name: name, teacher: teacher,
      color: colors[state.courses.length % colors.length],
      notes: [], todos: []
    });
    state.activeCourseId = state.courses[state.courses.length - 1].id;
    save(); renderAll();
    toast('课程已创建');
  }
  function deleteCourse(id) {
    if (!confirm('确定删除该课程及其所有笔记？')) return;
    state.courses = state.courses.filter(function (c) { return c.id !== id; });
    if (state.activeCourseId === id) {
      state.activeCourseId = state.courses.length ? state.courses[0].id : null;
    }
    save(); renderAll(); closeSidebar();
    toast('课程已删除');
  }
  function selectCourse(id) {
    if (isRec) stopRecording(true);
    state.activeCourseId = id;
    expandedNoteId = null;
    save(); renderMain(); closeSidebar();
  }
  function openCourseModal(id) {
    editCourseId = id || null;
    $('courseModalTitle').textContent = id ? '编辑课程' : '新建课程';
    const c = id ? state.courses.find(function (x) { return x.id === id; }) : null;
    $('courseName').value = c ? c.name : '';
    $('courseTeacher').value = c ? c.teacher : '';
    openModal('courseModal');
    setTimeout(function () { $('courseName').focus(); }, 60);
  }
  function saveCourseModal() {
    const name = $('courseName').value.trim();
    if (!name) { $('courseName').focus(); return; }
    if (editCourseId) {
      const c = state.courses.find(function (x) { return x.id === editCourseId; });
      if (c) { c.name = name; c.teacher = $('courseTeacher').value.trim(); save(); renderAll(); toast('课程已更新'); }
    } else {
      addCourse(name, $('courseTeacher').value.trim());
    }
    closeModal('courseModal');
  }

  // ---------- 笔记 / 待办 ----------
  function addNote(cid, title, date, content, keyPoints) {
    const c = state.courses.find(function (x) { return x.id === cid; });
    if (!c) return;
    c.notes.push({ id: uid(), title: title, date: date, content: content, keyPoints: keyPoints, pinned: false });
    save(); renderAll(); toast('笔记已创建');
  }
  function updateNote(cid, nid, data) {
    const c = state.courses.find(function (x) { return x.id === cid; });
    if (!c) return;
    const n = c.notes.find(function (x) { return x.id === nid; });
    if (!n) return;
    Object.assign(n, data);
    save(); renderAll(); toast('笔记已更新');
  }
  function deleteNote(cid, nid) {
    const c = state.courses.find(function (x) { return x.id === cid; });
    if (!c) return;
    c.notes = c.notes.filter(function (x) { return x.id !== nid; });
    if (expandedNoteId === nid) expandedNoteId = null;
    save(); renderAll(); toast('笔记已删除');
  }
  function togglePinNote(cid, nid) {
    const c = state.courses.find(function (x) { return x.id === cid; });
    if (!c) return;
    const n = c.notes.find(function (x) { return x.id === nid; });
    if (!n) return;
    n.pinned = !n.pinned;
    save(); renderAll();
  }
  function openNoteModal(nid) {
    const c = getCourse();
    if (!c) return;
    editNoteId = nid || null;
    $('noteModalTitle').textContent = nid ? '编辑笔记' : '新建笔记';
    const n = nid ? c.notes.find(function (x) { return x.id === nid; }) : null;
    $('noteTitle').value = n ? n.title : '';
    $('noteDate').value = n ? n.date : today();
    $('noteContent').value = n ? n.content : '';
    $('noteKeyPoints').value = n && n.keyPoints ? n.keyPoints.join('\n') : '';
    openModal('noteModal');
    setTimeout(function () { $('noteTitle').focus(); }, 60);
  }
  function saveNoteModal() {
    const c = getCourse();
    if (!c) return;
    const title = $('noteTitle').value.trim();
    if (!title) { $('noteTitle').focus(); return; }
    const data = {
      title: title,
      date: $('noteDate').value || today(),
      content: $('noteContent').value.trim(),
      keyPoints: $('noteKeyPoints').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean)
    };
    if (editNoteId) updateNote(c.id, editNoteId, data);
    else addNote(c.id, data.title, data.date, data.content, data.keyPoints);
    closeModal('noteModal');
  }

  function addTodo(cid, title, dueDate, priority) {
    const c = state.courses.find(function (x) { return x.id === cid; });
    if (!c) return;
    c.todos.push({ id: uid(), title: title, dueDate: dueDate, priority: priority, completed: false });
    save(); renderAll(); toast('待办已创建');
  }
  function toggleTodo(cid, tid) {
    const c = state.courses.find(function (x) { return x.id === cid; });
    if (!c) return;
    const t = c.todos.find(function (x) { return x.id === tid; });
    if (!t) return;
    t.completed = !t.completed;
    save(); renderAll();
    if (t.completed) toast('已完成');
  }
  function deleteTodo(cid, tid) {
    const c = state.courses.find(function (x) { return x.id === cid; });
    if (!c) return;
    c.todos = c.todos.filter(function (x) { return x.id !== tid; });
    save(); renderAll(); toast('待办已删除');
  }
  function openTodoModal() {
    $('todoTitle').value = '';
    $('todoDueDate').value = today();
    $('todoPriority').value = 'medium';
    openModal('todoModal');
    setTimeout(function () { $('todoTitle').focus(); }, 60);
  }
  function saveTodoModal() {
    const c = getCourse();
    if (!c) return;
    const title = $('todoTitle').value.trim();
    if (!title) { $('todoTitle').focus(); return; }
    addTodo(c.id, title, $('todoDueDate').value, $('todoPriority').value);
    closeModal('todoModal');
  }

  // ---------- 渲染 ----------
  function renderStats() {
    const el = $('sidebarFooter');
    if (!el) return;
    let notes = 0, todos = 0, done = 0;
    state.courses.forEach(function (c) {
      notes += c.notes.length;
      todos += c.todos.length;
      c.todos.forEach(function (t) { if (t.completed) done++; });
    });
    const rate = todos ? Math.round(done / todos * 100) : 0;
    el.innerHTML =
      '<div class="stat-item"><div class="stat-value">' + notes + '</div><div class="stat-label">笔记</div></div>' +
      '<div class="stat-item"><div class="stat-value">' + todos + '</div><div class="stat-label">待办</div></div>' +
      '<div class="stat-item"><div class="stat-value">' + rate + '%</div><div class="stat-label">完成率</div></div>';
  }

  function renderSidebar() {
    const el = $('courseList');
    if (!state.courses.length) {
      el.innerHTML = '<div class="empty"><svg class="icon"><use href="assets/icons.svg#icon-book"></use></svg><p>还没有课程<br>点击右上角 + 新建</p></div>';
      return;
    }
    el.innerHTML = state.courses.map(function (c) {
      const active = c.id === state.activeCourseId ? ' active' : '';
      return '<div class="course-row' + active + '">' +
        '<button type="button" class="course-select" data-action="select" data-id="' + c.id + '">' +
        '<span class="course-dot" style="background:' + c.color + '"></span>' +
        '<span class="course-name">' + esc(c.name) + '</span></button>' +
        '<div class="course-actions">' +
        '<button type="button" class="course-action" data-action="edit" data-id="' + c.id + '" aria-label="编辑课程"><svg class="icon icon-sm"><use href="assets/icons.svg#icon-edit"></use></svg></button>' +
        '<button type="button" class="course-action danger" data-action="delete" data-id="' + c.id + '" aria-label="删除课程"><svg class="icon icon-sm"><use href="assets/icons.svg#icon-trash"></use></svg></button>' +
        '</div></div>';
    }).join('');
  }

  function renderMain() {
    const el = $('mainInner');
    const c = getCourse();
    if (!c) {
      el.innerHTML = '<div class="main-placeholder">' +
        '<svg class="icon"><use href="assets/icons.svg#icon-book"></use></svg>' +
        '<p>选择或创建一门课程开始整理</p>' +
        '<button type="button" class="btn btn-primary" data-action="new-course">新建课程</button></div>';
      return;
    }
    const undone = c.todos.filter(function (t) { return !t.completed; }).length;
    el.innerHTML =
      '<div class="course-head">' +
      '<span class="course-bar" style="background:' + c.color + '"></span>' +
      '<h1>' + esc(c.name) + '</h1>' +
      (c.teacher ? '<span class="teacher-badge">' + esc(c.teacher) + '</span>' : '') +
      '</div>' +
      '<div class="tabs" role="tablist" aria-label="课程视图">' +
      '<button type="button" class="tab' + (ct === 'notes' ? ' active' : '') + '" data-tab="notes" role="tab" aria-selected="' + (ct === 'notes') + '">笔记 <span class="tab-count">' + c.notes.length + '</span></button>' +
      '<button type="button" class="tab' + (ct === 'todos' ? ' active' : '') + '" data-tab="todos" role="tab" aria-selected="' + (ct === 'todos') + '">待办 <span class="tab-count">' + undone + '</span></button>' +
      '</div>' +
      '<div id="tabContent" style="margin-top:16px"></div>';
    renderTab(ct);
  }

  function renderTab(tab) {
    const c = getCourse();
    if (!c) return;
    const panel = $('tabContent');
    if (isRec) { renderRecPanel(); return; }
    if (tab === 'notes') renderNotes(panel);
    else renderTodos(panel);
  }

  function switchTab(tab) {
    ct = tab;
    renderMain();
  }

  function renderNotes(container) {
    const c = getCourse();
    if (!c) return;
    let notes = c.notes.slice();
    if (sq) {
      notes = notes.filter(function (n) {
        return n.title.toLowerCase().indexOf(sq) !== -1 || n.content.toLowerCase().indexOf(sq) !== -1;
      });
    }
    const list = notes.filter(function (n) { return n.pinned; }).concat(notes.filter(function (n) { return !n.pinned; }));
    let html = '<div class="section-head"><span class="section-count">共 ' + list.length + ' 条笔记</span>' +
      '<div class="section-btns">' +
      '<button type="button" class="btn btn-soft btn-sm" data-action="record"><svg class="icon icon-sm"><use href="assets/icons.svg#icon-mic"></use></svg>录音</button>' +
      '<button type="button" class="btn btn-primary btn-sm" data-action="new-note"><svg class="icon icon-sm"><use href="assets/icons.svg#icon-plus"></use></svg>新建</button>' +
      '</div></div>';
    if (!list.length) {
      const icon = sq ? 'search' : 'notebook';
      const text = sq ? '没有匹配的笔记' : '还没有笔记，点击“新建”开始记录';
      html += '<div class="empty"><svg class="icon"><use href="assets/icons.svg#icon-' + icon + '"></use></svg><p>' + text + '</p></div>';
    } else {
      list.forEach(function (n) {
        html += '<article class="note-card' + (n.pinned ? ' pinned' : '') + (expandedNoteId === n.id ? ' expanded' : '') + '" data-action="expand" data-id="' + n.id + '">' +
          '<div class="note-head">' +
          '<button type="button" class="note-pin" data-action="pin" data-id="' + n.id + '" aria-label="置顶"><svg class="icon icon-sm"><use href="assets/icons.svg#icon-pin"></use></svg></button>' +
          '<span class="note-title">' + esc(n.title) + '</span>' +
          '<span class="note-meta">' + fmtDate(n.date) + '</span></div>' +
          '<div class="note-body">' +
          (n.content ? '<div class="note-content">' + esc(n.content) + '</div>' : '') +
          (n.keyPoints && n.keyPoints.length ? '<div class="keypoints"><div class="keypoints-label">重点</div>' + n.keyPoints.map(function (k) { return '<div class="kp-item">' + esc(k) + '</div>'; }).join('') + '</div>' : '') +
          '<div class="note-actions">' +
          '<button type="button" class="btn btn-secondary btn-sm" data-action="edit-note" data-id="' + n.id + '">编辑</button>' +
          '<button type="button" class="btn btn-soft btn-sm" data-action="ai" data-id="' + n.id + '" id="ai-btn-' + n.id + '"><svg class="icon icon-sm"><use href="assets/icons.svg#icon-sparkles"></use></svg>AI 总结</button>' +
          '<button type="button" class="btn btn-danger btn-sm" data-action="delete-note" data-id="' + n.id + '">删除</button>' +
          '</div></div></article>';
      });
    }
    container.innerHTML = html;
  }

  function renderTodos(container) {
    const c = getCourse();
    if (!c) return;
    const inc = c.todos.filter(function (t) { return !t.completed; });
    const cmp = c.todos.filter(function (t) { return t.completed; });
    const label = { high: '高', medium: '中', low: '低' };
    const cls = { high: 'priority-high', medium: 'priority-medium', low: 'priority-low' };
    function row(t) {
      return '<div class="todo-item' + (t.completed ? ' done' : '') + '">' +
        '<button type="button" class="todo-check" data-action="toggle" data-id="' + t.id + '" aria-label="完成"><svg class="icon icon-sm"><use href="assets/icons.svg#icon-check"></use></svg></button>' +
        '<span class="todo-title">' + esc(t.title) + '</span>' +
        '<span class="todo-priority ' + cls[t.priority] + '">' + label[t.priority] + '</span>' +
        '<span class="todo-date">' + fmtDate(t.dueDate) + '</span>' +
        '<button type="button" class="todo-del" data-action="delete" data-id="' + t.id + '" aria-label="删除"><svg class="icon icon-sm"><use href="assets/icons.svg#icon-trash"></use></svg></button>' +
        '</div>';
    }
    let html = '<div class="section-head"><span class="section-count">' + inc.length + ' 项未完成</span>' +
      '<div class="section-btns"><button type="button" class="btn btn-primary btn-sm" data-action="new-todo"><svg class="icon icon-sm"><use href="assets/icons.svg#icon-plus"></use></svg>新建待办</button></div></div>';
    if (!c.todos.length) {
      html += '<div class="empty"><svg class="icon"><use href="assets/icons.svg#icon-list"></use></svg><p>还没有待办</p></div>';
    } else {
      if (inc.length) html += '<div class="todo-group"><div class="todo-group-label">未完成</div>' + inc.map(row).join('') + '</div>';
      if (cmp.length) html += '<div class="todo-group"><div class="todo-group-label">已完成</div>' + cmp.map(row).join('') + '</div>';
    }
    container.innerHTML = html;
  }

  function renderAll() {
    renderSidebar();
    renderMain();
    renderStats();
  }

  // ---------- 录音 ----------
  function initRec() {
    const S = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!S) return false;
    rec = new S();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = 'zh-CN';
    rec.onresult = function (e) {
      let im = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) fin += e.results[i][0].transcript;
        else im += e.results[i][0].transcript;
      }
      inter = im;
      updTxt();
    };
    rec.onerror = function (e) {
      if (e.error === 'not-allowed') {
        toast('麦克风权限被拒绝', 'error');
        stopRecording(true);
      } else if (e.error === 'network') {
        toast('语音识别网络不稳定，请重试', 'error');
      }
    };
    rec.onend = function () {
      if (isRec && !isPause) {
        setTimeout(function () { try { rec.start(); } catch (ex) {} }, 150);
      }
    };
    return true;
  }
  function startRecording() {
    if (!state.activeCourseId) { toast('请先选择课程', 'error'); return; }
    if (!rec && !initRec()) { toast('录音功能需要 Chrome / Edge 浏览器', 'error'); return; }
    fin = ''; inter = '';
    isRec = true; isPause = false;
    recStart = Date.now();
    try { rec.start(); } catch (e) {}
    startRecTimer();
    renderMain();
    if (ct !== 'notes') switchTab('notes');
  }
  function stopRecording(silent) {
    isRec = false; isPause = false;
    stopRecTimer();
    try { rec.stop(); } catch (e) {}
    if (!silent) {
      const text = (fin + inter).trim();
      if (text) openNoteModalForRecording(text);
    }
    renderMain();
  }
  function togglePause() {
    if (isPause) {
      isPause = false;
      try { rec.start(); } catch (e) {}
    } else {
      isPause = true;
      try { rec.stop(); } catch (e) {}
    }
    updPBtn();
  }
  function startRecTimer() {
    recTimer = setInterval(function () {
      const total = Math.floor((Date.now() - recStart) / 1000);
      const m = Math.floor(total / 60);
      const s = total % 60;
      const el = $('recTimer');
      if (el) el.textContent = pad2(m) + ':' + pad2(s);
    }, 1000);
  }
  function stopRecTimer() {
    if (recTimer) { clearInterval(recTimer); recTimer = null; }
  }
  function updTxt() {
    const el = $('recText');
    if (!el) return;
    let html = '';
    if (fin) html += esc(fin);
    if (inter) html += '<span class="interim">' + esc(inter) + '</span>';
    el.innerHTML = html;
    el.scrollTop = el.scrollHeight;
  }
  function updPBtn() {
    const btn = $('btnPause');
    if (btn) btn.textContent = isPause ? '继续' : '暂停';
  }
  function renderRecPanel() {
    const panel = $('tabContent');
    if (!panel) return;
    panel.innerHTML =
      '<div class="rec-panel">' +
      '<div class="rec-status"><div class="rec-dot"></div>' +
      '<div class="rec-wave"><span></span><span></span><span></span><span></span><span></span></div>' +
      '<span class="rec-label">正在录音</span>' +
      '<span class="rec-timer" id="recTimer">00:00</span></div>' +
      '<div class="rec-text" id="recText"></div>' +
      '<div class="rec-controls">' +
      '<button type="button" class="btn btn-secondary" id="btnPause" data-action="pause">暂停</button>' +
      '<button type="button" class="btn btn-danger" data-action="stop"><svg class="icon icon-sm"><use href="assets/icons.svg#icon-mic"></use></svg>停止</button>' +
      '</div></div>';
  }
  function openNoteModalForRecording(text) {
    const c = getCourse();
    const title = (c ? c.name : '') + ' - 录音笔记 ' + fmtDate(today());
    editNoteId = null;
    $('noteModalTitle').textContent = '保存录音笔记';
    $('noteTitle').value = title;
    $('noteDate').value = today();
    $('noteContent').value = text;
    $('noteKeyPoints').value = extractKeyPoints(text).join('\n');
    openModal('noteModal');
    setTimeout(function () { $('noteTitle').focus(); }, 60);
  }

  const KEYWORDS = ['重要', '重点', '关键', '注意', '记住', '总结', '核心', '必须', '一定要', '考点', '考试', '强调', '特别', '尤其', '需要掌握', '一定记住'];
  function extractKeyPoints(text) {
    const sentences = text.split(/[\u3002\uff01\uff1f\?\n]+/).filter(function (s) { return s.trim().length > 4; });
    const scored = sentences.map(function (s) {
      let score = 0;
      KEYWORDS.forEach(function (k) { if (s.indexOf(k) !== -1) score += 3; });
      if (s.length > 15 && s.length < 80) score += 1;
      return { text: s.trim(), score: score };
    });
    scored.sort(function (a, b) { return b.score - a.score; });
    return scored.filter(function (s) { return s.score >= 1; }).slice(0, 5).map(function (s) { return s.text; });
  }

  // ---------- AI ----------
  function loadAISettings() {
    try {
      const raw = localStorage.getItem(AI_KEY);
      const data = raw ? JSON.parse(raw) : {};
      aiS = {
        endpoint: String(data.endpoint || 'https://api.deepseek.com/v1').replace(/\/+$/, ''),
        key: String(data.key || ''),
        model: String(data.model || 'deepseek-chat')
      };
    } catch (e) {
      aiS = { endpoint: 'https://api.deepseek.com/v1', key: '', model: 'deepseek-chat' };
    }
  }
  function saveAISettings() {
    try {
      aiS.endpoint = $('aiEndpoint').value.trim().replace(/\/+$/, '');
      aiS.key = $('aiApiKey').value.trim();
      aiS.model = $('aiModel').value.trim() || 'deepseek-chat';
      localStorage.setItem(AI_KEY, JSON.stringify(aiS));
      const status = $('aiStatus');
      status.textContent = aiS.key ? '已保存' : '请填写';
      status.className = 'ai-status' + (aiS.key ? ' success' : ' error');
      closeModal('aiSettingsModal');
      toast('AI 设置已保存');
    } catch (e) {
      toast('保存失败', 'error');
    }
  }
  function openAISettings() {
    loadAISettings();
    $('aiEndpoint').value = aiS.endpoint;
    $('aiApiKey').value = aiS.key;
    $('aiModel').value = aiS.model;
    const status = $('aiStatus');
    status.textContent = aiS.key ? '已配置' : '请填写';
    status.className = 'ai-status' + (aiS.key ? ' success' : '');
    openModal('aiSettingsModal');
  }
  async function callAISummary(text, title) {
    loadAISettings();
    if (!aiS.key) throw new Error('请先配置 API Key');
    const prompt =
      '你是一个课堂笔记整理助手。请先纠正语音转录文字（修正同音字、补充标点、理顺逻辑），使语句通顺，然后提炼核心内容：\n' +
      '1.去除重复废话\n2.保留核心知识点\n3.组织成简洁语言\n4.提取3-5个重点\n\n' +
      '标题：' + (title || '') + '\n内容：\n' + text +
      '\n\n用JSON返回：\n{"summary":"提炼后的笔记","keyPoints":["重点1","重点2","重点3"]}';
    const res = await fetch(aiS.endpoint + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + aiS.key },
      body: JSON.stringify({
        model: aiS.model,
        messages: [
          { role: 'system', content: '你是课堂笔记助手，擅长提炼重点。' },
          { role: 'user', content: prompt }
        ],
        temperature: 0.3,
        max_tokens: 2048
      })
    });
    if (!res.ok) {
      let msg = '请求失败 HTTP ' + res.status;
      try {
        const err = await res.json();
        if (err && err.error && err.error.message) msg = err.error.message;
      } catch (e) {}
      throw new Error(msg);
    }
    const data = await res.json();
    const content = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
    const clean = content.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
    const parsed = JSON.parse(clean);
    return {
      summary: String(parsed.summary || ''),
      keyPoints: Array.isArray(parsed.keyPoints) ? parsed.keyPoints.map(String) : []
    };
  }
  async function aiSummarizeNote(nid) {
    const c = getCourse();
    if (!c) return;
    const n = c.notes.find(function (x) { return x.id === nid; });
    if (!n || !n.content.trim()) { toast('笔记内容为空', 'error'); return; }
    const btn = $('ai-btn-' + nid);
    if (btn) { btn.disabled = true; btn.classList.add('loading'); }
    try {
      const result = await callAISummary(n.content, n.title);
      aiR = { noteId: nid, courseId: c.id, summary: result.summary, keyPoints: result.keyPoints };
      $('summaryContent').textContent = result.summary;
      $('summaryKeyPoints').innerHTML = result.keyPoints.map(function (k) { return '<div class="kp-item">' + esc(k) + '</div>'; }).join('');
      openModal('aiSummaryModal');
    } catch (e) {
      if (e && e.message === '请先配置 API Key') openAISettings();
      else alert('AI 总结失败：' + (e && e.message ? e.message : '未知错误'));
    } finally {
      if (btn) { btn.disabled = false; btn.classList.remove('loading'); }
    }
  }
  function applyAISummary() {
    if (!aiR) return;
    const c = state.courses.find(function (x) { return x.id === aiR.courseId; });
    if (!c) return;
    const n = c.notes.find(function (x) { return x.id === aiR.noteId; });
    if (!n) return;
    n.content = aiR.summary;
    n.keyPoints = aiR.keyPoints;
    save(); renderAll();
    closeModal('aiSummaryModal');
    aiR = null;
    toast('AI 总结已应用');
  }

  // ---------- 事件绑定 ----------
  $('themeBtn').addEventListener('click', toggleDarkMode);
  $('aiSettingsBtn').addEventListener('click', openAISettings);
  $('addCourseBtn').addEventListener('click', function () { openCourseModal(); });
  $('menuBtn').addEventListener('click', openSidebar);
  $('sidebarBackdrop').addEventListener('click', closeSidebar);
  $('saveCourseBtn').addEventListener('click', saveCourseModal);
  $('saveNoteBtn').addEventListener('click', saveNoteModal);
  $('saveTodoBtn').addEventListener('click', saveTodoModal);
  $('saveAiBtn').addEventListener('click', saveAISettings);
  $('applyAiBtn').addEventListener('click', applyAISummary);

  function openSidebar() {
    document.body.classList.add('sidebar-open');
    $('sidebarBackdrop').hidden = false;
  }
  function closeSidebar() {
    document.body.classList.remove('sidebar-open');
    $('sidebarBackdrop').hidden = true;
  }

  $('courseList').addEventListener('click', function (e) {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    const id = btn.dataset.id;
    if (action === 'select') selectCourse(id);
    else if (action === 'edit') openCourseModal(id);
    else if (action === 'delete') deleteCourse(id);
  });

  $('mainInner').addEventListener('click', function (e) {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    const id = el.dataset.id;
    const c = getCourse();

    if (action === 'new-course') { openCourseModal(); return; }
    if (action === 'new-note') { openNoteModal(); return; }
    if (action === 'new-todo') { openTodoModal(); return; }
    if (action === 'record') { startRecording(); return; }
    if (action === 'pause') { togglePause(); return; }
    if (action === 'stop') { stopRecording(); return; }
    if (!c) return;
    if (action === 'expand') {
      expandedNoteId = expandedNoteId === id ? null : id;
      renderTab(ct);
      return;
    }
    if (action === 'pin') { togglePinNote(c.id, id); return; }
    if (action === 'edit-note') { openNoteModal(id); return; }
    if (action === 'delete-note') { deleteNote(c.id, id); return; }
    if (action === 'ai') { aiSummarizeNote(id); return; }
    if (action === 'toggle') { toggleTodo(c.id, id); return; }
    if (action === 'delete' && el.classList.contains('todo-del')) { deleteTodo(c.id, id); return; }
  });

  $('mainInner').addEventListener('click', function (e) {
    const tab = e.target.closest('[data-tab]');
    if (!tab) return;
    switchTab(tab.dataset.tab);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeAllModals(); return; }
    const mod = e.ctrlKey || e.metaKey;
    if (!mod) return;
    const key = e.key.toLowerCase();
    if (key === 'n') { e.preventDefault(); if (getCourse()) openNoteModal(); }
    else if (key === 't') { e.preventDefault(); if (getCourse()) openTodoModal(); }
    else if (key === 'd') { e.preventDefault(); toggleDarkMode(); }
  });

  // ---------- 离线可用 ----------
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('assets/sw.js').catch(function () {});
    });
  }

  // ---------- 初始化 ----------
  load();
  loadAISettings();
  applySavedTheme();
  renderAll();
})();
</script>
</body>
</html>
