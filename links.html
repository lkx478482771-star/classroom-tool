<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta http-equiv="x-dns-prefetch-control" content="off">

<meta name="description" content="安大学生工具箱 · 网址集成：把校园入口、学习工具和常用网站收进一个可搜索、可自定义的导航页，数据只保存在本机浏览器。">
<title>网址集成 · 安大学生工具箱</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/links.css">
</head>
<body class="links-page">
<a class="skip-link" href="#groupsWrap">跳到网址列表</a>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="icon-grad" viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5v5"/><path d="M6 12.5V17c0 1.66 2.69 3 6 3s6-1.34 6-3v-4.5"/><path d="M22 10v5"/></symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
  <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
  <symbol id="icon-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
  <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
  <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="icon-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="icon-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol>
  <symbol id="icon-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>
  <symbol id="icon-up" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></symbol>
  <symbol id="icon-down" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>
  <symbol id="icon-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
  <symbol id="icon-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
</svg>

<header class="site-nav links-header">
  <div class="nav-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark"><svg class="icon"><use href="#icon-grad"></use></svg></span>
      <span class="brand-name">安大学生工具箱</span>
    </a>
    <nav class="nav-links" aria-label="页面导航">
      <a href="index.html">首页</a>
      <a href="student-toolkit.html#majorManager">我的专业</a>
      <a href="student-toolkit.html#major">专业路线</a>
      <a href="student-toolkit.html#tools">学习导航</a>
      <a href="student-toolkit.html#nav">校园导航</a>
      <a href="links.html" class="active" aria-current="page">网址集成</a>
      <a href="student-toolkit.html#backup">数据备份</a>
    </nav>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="切换深色模式">深色</button>
  </div>
</header>

<main class="links-main" id="main-content">
  <section class="links-hero" aria-labelledby="linksTitle">
    <div class="links-hero-text">
      <span class="links-kicker">MY LINKS</span>
      <h1 id="linksTitle">网址集成</h1>
      <p>把校园入口、学习工具和常用网站收进一个页面。支持搜索、分组、折叠与自定义，数据只保存在本机浏览器里。</p>
    </div>
    <div class="links-stats" aria-label="网址统计">
      <div><strong id="statLinks">0</strong><span>个网址</span></div>
      <div><strong id="statGroups">0</strong><span>个分组</span></div>
    </div>
  </section>

  <section class="links-toolbar" aria-label="网址操作">
    <div class="links-search">
      <svg class="icon" aria-hidden="true"><use href="#icon-search"></use></svg>
      <input class="input" id="searchInput" type="search" placeholder="搜索名称、网址或描述" autocomplete="off" aria-label="搜索网址">
      <button type="button" class="search-clear" id="clearSearch" aria-label="清空搜索" hidden><svg class="icon icon-sm" aria-hidden="true"><use href="#icon-x"></use></svg></button>
    </div>
    <div class="links-actions">
      <button type="button" class="btn btn-primary" id="addLinkBtn">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-plus"></use></svg>添加网址
      </button>
      <button type="button" class="btn btn-secondary" id="manageGroupsBtn">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-folder"></use></svg>分组管理
      </button>
      <button type="button" class="btn btn-secondary" id="exportBtn">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-download"></use></svg>导出
      </button>
      <button type="button" class="btn btn-secondary" id="importBtn">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-upload"></use></svg>导入
      </button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </section>

  <p class="search-note" id="searchNote" role="status" hidden></p>

  <div class="groups-wrap" id="groupsWrap"></div>

  <div class="links-empty" id="emptyAll" hidden>
    <svg class="icon icon-xl" aria-hidden="true"><use href="#icon-link"></use></svg>
    <h2>还没有任何网址</h2>
    <p>点右上角「+ 添加网址」添加你的第一个网址，也可以恢复内置的常用网址。</p>
    <div class="links-empty-actions">
      <button type="button" class="btn btn-primary" id="emptyAddBtn">添加网址</button>
      <button type="button" class="btn btn-secondary" id="restoreDefaultsBtn">恢复默认网址</button>
    </div>
  </div>

  <noscript>
    <div class="links-empty">
      <h2>需要启用 JavaScript</h2>
      <p>本页的网址管理依赖浏览器本地存储，请在浏览器设置中启用 JavaScript 后刷新页面。</p>
    </div>
  </noscript>
</main>

<footer class="links-footer">安大学生工具箱 · 网址集成 · 数据保存在本机浏览器</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="modal-overlay" id="linkModal" aria-hidden="true">
  <div class="modal links-modal" role="dialog" aria-modal="true" aria-labelledby="linkModalTitle">
    <form id="linkForm" novalidate>
      <div class="modal-head">
        <h3 id="linkModalTitle">添加网址</h3>
        <button type="button" class="modal-close" data-close="linkModal" aria-label="关闭"><svg class="icon icon-sm" aria-hidden="true"><use href="#icon-x"></use></svg></button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label class="label" for="linkName">名称 <span class="req">*</span></label>
          <input class="input" id="linkName" type="text" maxlength="60" placeholder="例如：智慧安大" autocomplete="off">
        </div>
        <div class="field">
          <label class="label" for="linkUrl">网址 <span class="req">*</span></label>
          <input class="input" id="linkUrl" type="text" inputmode="url" placeholder="https://example.com" autocomplete="off" spellcheck="false">
          <p class="hint">只支持 http:// 或 https://；不写协议会自动补上 https://。</p>
        </div>
        <div class="field">
          <label class="label" for="linkGroup">分组</label>
          <select class="select" id="linkGroup"></select>
        </div>
        <div class="field" id="newGroupField" hidden>
          <label class="label" for="linkNewGroup">新分组名称</label>
          <input class="input" id="linkNewGroup" type="text" maxlength="30" placeholder="例如：实验室常用">
        </div>
        <div class="field">
          <label class="label" for="linkDesc">描述 <span class="optional">（选填）</span></label>
          <input class="input" id="linkDesc" type="text" maxlength="80" placeholder="一句话说明，例如：教务、学工、办事服务统一入口">
        </div>
        <p class="form-error" id="linkFormError" role="alert" hidden></p>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-secondary" data-close="linkModal">取消</button>
        <button type="submit" class="btn btn-primary" id="linkSubmitBtn">保存网址</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="groupModal" aria-hidden="true">
  <div class="modal links-modal" role="dialog" aria-modal="true" aria-labelledby="groupModalTitle">
    <div class="modal-head">
      <h3 id="groupModalTitle">分组管理</h3>
      <button type="button" class="modal-close" data-close="groupModal" aria-label="关闭"><svg class="icon icon-sm" aria-hidden="true"><use href="#icon-x"></use></svg></button>
    </div>
    <div class="modal-body">
      <div class="group-create">
        <input class="input" id="newGroupName" type="text" maxlength="30" placeholder="输入新分组名称" aria-label="新分组名称">
        <button type="button" class="btn btn-primary btn-sm" id="createGroupBtn">新建分组</button>
      </div>
      <p class="hint">可以新建、重命名、调整顺序或删除分组；分组内有网址时，会先确认再一并删除。</p>
      <div class="group-manage-list" id="groupManageList"></div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-secondary" data-close="groupModal">完成</button>
    </div>
  </div>
</div>

<script src="assets/links.js" defer></script>
<script>if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); }); }</script>
</body>
</html>
