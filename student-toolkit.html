<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安大学生工具箱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#1a1d26;line-height:1.6;-webkit-font-smoothing:antialiased}
.nav{position:fixed;top:0;left:0;right:0;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);z-index:100;display:flex;justify-content:center;gap:0}
.nav a{display:inline-block;padding:16px 28px;color:#5a6170;text-decoration:none;font-size:14px;font-weight:500;transition:all .2s;position:relative}
.nav a::after{content:"";position:absolute;bottom:0;left:50%;width:0;height:2px;background:#6366f1;transition:all .2s;transform:translateX(-50%)}
.nav a:hover{color:#6366f1}.nav a:hover::after{width:24px}.nav a.active{color:#6366f1;font-weight:600}
.container{max-width:680px;margin:0 auto;padding:80px 20px 40px}.section{margin-bottom:48px}
.card{background:#fff;border-radius:14px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,.06);transition:all .2s}
.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1)}
.card h2{font-size:20px;font-weight:700;margin-bottom:20px;color:#1a1d26;display:flex;align-items:center;gap:8px}
.input-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.input-row input{flex:1;min-width:80px;padding:10px 14px;border:1.5px solid #e2e6ee;border-radius:10px;font-size:14px;outline:none;transition:all .2s;background:#f9fafb}
.input-row input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.1);background:#fff}
.btn{padding:10px 22px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:4px}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,#6366f1,#7c3aed);color:#fff;box-shadow:0 2px 8px rgba(99,102,241,.3)}
.btn-primary:hover{box-shadow:0 4px 14px rgba(99,102,241,.4)}
.btn-outline{background:#fff;color:#6366f1;border:1.5px solid #6366f1}.btn-outline:hover{background:#eef2ff}
.btn-danger{background:#fff;color:#ef4444;border:1.5px solid #fecaca}.btn-danger:hover{background:#fef2f2}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:8px}
.course-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
.course-table th{text-align:left;padding:8px 12px;color:#949bac;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1.5px solid #e2e6ee}
.course-table td{padding:10px 12px;border-bottom:1px solid #f0f2f6;color:#5a6170}
.result-box{padding:16px 20px;background:linear-gradient(135deg,#eef2ff,rgba(124,58,237,.05));border-radius:12px;margin-top:16px;display:flex;align-items:center;gap:16px}
.result-value{font-size:32px;font-weight:800;color:#6366f1}.result-label{font-size:12px;color:#949bac}
.quick-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.countdown-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#f9fafb;border-radius:10px;margin-bottom:8px;transition:all .2s}
.countdown-item:hover{background:#f0f2f6}
.countdown-name{flex:1;font-weight:600;font-size:14px}
.countdown-time{font-size:20px;font-weight:700;color:#6366f1;font-variant-numeric:tabular-nums;min-width:120px}
.clock-display{text-align:center;padding:16px 0}
.clock-time{font-size:48px;font-weight:800;color:#1a1d26;letter-spacing:2px}
.clock-date{font-size:14px;color:#949bac;margin-top:4px}
.rule-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.rule-table td{padding:6px 10px;border-bottom:1px solid #f0f2f6}
.back-top{position:fixed;bottom:24px;right:24px;width:40px;height:40px;background:#6366f1;color:#fff;border:none;border-radius:50%;cursor:pointer;font-size:18px;display:none;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(99,102,241,.3);transition:all .2s;z-index:99}
.back-top:hover{transform:translateY(-2px)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:200;opacity:0;transition:all .3s;pointer-events:none;background:#10b981;color:#fff}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-8px)}.toast.error{background:#ef4444}
@media(max-width:600px){.container{padding:70px 12px 30px}.input-row{flex-direction:column}.countdown-time{font-size:16px;min-width:100px}.card{padding:20px}}
</style>
</head>
<body>
<nav class="nav"><a href="#gpa" class="active">绩点计算器</a><a href="#countdown">倒计时</a><a href="#clock">时钟</a></nav>
<div class="container">
<section class="section" id="gpa"><div class="card">
<h2>绩点计算器</h2><div id="courseList"></div>
<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
<button class="btn btn-outline btn-sm" onclick="addCourse()">+ 添加课程</button>
<button class="btn btn-primary btn-sm" onclick="calcGPA()">计算绩点</button>
<button class="btn btn-danger btn-sm" onclick="clearCourses()">清空</button>
<button class="btn btn-outline btn-sm" onclick="exportCourses()">导出</button></div>
<div class="result-box" id="gpaResult" style="display:none"><div><div class="result-value" id="gpaValue">0.00</div><div class="result-label">加权平均绩点</div></div><div><div class="result-value" id="gpaTotal">0</div><div class="result-label">总学分</div></div></div>
<details style="margin-top:12px"><summary style="font-size:12px;color:#949bac;cursor:pointer">安大绩点换算规则</summary><table class="rule-table"><tr><td>90-100</td><td>4.0</td><td>85-89</td><td>3.7</td><td>82-84</td><td>3.3</td></tr><tr><td>78-81</td><td>3.0</td><td>75-77</td><td>2.7</td><td>72-74</td><td>2.3</td></tr><tr><td>68-71</td><td>2.0</td><td>64-67</td><td>1.5</td><td>60-63</td><td>1.0</td></tr><tr><td>&lt;60</td><td>0</td></tr></table><p style="font-size:11px;color:#949bac;margin-top:4px">当前采用安徽大学成绩-绩点换算规则，其他学校请自行核对。</p></details>
</div></section>
<section class="section" id="countdown"><div class="card"><h2>倒计时</h2>
<div class="quick-btns"><button class="btn btn-outline btn-sm" onclick="quickAdd('英语四六级','2026-12-19')">四六级</button><button class="btn btn-outline btn-sm" onclick="quickAdd('期末考试','2027-01-15')">期末</button><button class="btn btn-outline btn-sm" onclick="quickAdd('考研','2026-12-26')">考研</button><button class="btn btn-outline btn-sm" onclick="quickAdd('开学','2027-02-20')">开学</button></div>
<div id="countdownList"></div>
<div class="input-row" style="margin-top:12px"><input id="cdName" placeholder="事件名称"><input id="cdDate" type="date"><button class="btn btn-primary btn-sm" onclick="addCountdown()">添加</button></div>
</div></section>
<section class="section" id="clock" style="margin-bottom:60px"><div class="card"><h2>时钟</h2><div class="clock-display"><div class="clock-time" id="clockTime">00:00:00</div><div class="clock-date" id="clockDate"></div></div></div></section>
</div>
<button class="back-top" id="backTop" onclick="scrollToTop()">↑</button>
<div class="toast" id="toast"></div>
